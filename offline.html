<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — E-Learniz v3</title>
    <meta name="theme-color" content="#121826" />
    <script>
      (function () {
        let isDark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        try {
          const raw = localStorage.getItem('elearniz_theme_settings');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.mode === 'light') isDark = false;
            else if (parsed.mode === 'dark') isDark = true;
          }
        } catch (_) {}
        const theme = isDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        const tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', theme === 'dark' ? '#121826' : '#ffffff');
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f3f7ff; color: #0f172a;
        min-height: 100vh; display: grid; place-items: center; padding: 20px;
      }
      .off-card {
        max-width: 440px; width: 100%; text-align: center;
        background: #fff; border: 2px solid #e2e8f0; border-radius: 20px;
        padding: 36px 24px; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      }
      .off-card .big { font-size: 3rem; margin-bottom: 8px; }
      .off-card h1 { font-size: 1.35rem; margin: 12px 0 8px; color: #0f172a; }
      .off-card p { color: #64748b; font-size: 0.92rem; margin-bottom: 22px; line-height: 1.6; }
      .btn {
        display: inline-block; padding: 12px 24px;
        background: #2563eb; color: #fff; font-weight: 700; font-size: 0.9rem;
        text-decoration: none; border-radius: 999px;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
        transition: transform 0.1s ease;
      }
      .btn:active { transform: scale(0.98); }

      [data-theme="dark"] body {
        background: #0a0e17; color: #f8fafc;
      }
      [data-theme="dark"] .off-card {
        background: #121826; border-color: rgba(255, 255, 255, 0.08); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      [data-theme="dark"] .off-card h1 { color: #f8fafc; }
      [data-theme="dark"] .off-card p { color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="off-card">
      <div class="big">📡</div>
      <h1>Kamu sedang offline</h1>
      <p>Halaman ini belum tersimpan di perangkat. Sambungkan internet sekali — jadwal dan materi yang pernah dibuka otomatis bisa diakses secara offline.</p>
      <a class="btn" href="./">⟵ Kembali ke Beranda</a>
    </div>
  </body>
</html>
